<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OGUSU Webform</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>

    <style>
      body {
        background: #f7f8fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      }

      /* HEADER */
      .header {
        background: #d5edff;
        border-bottom: 1px solid #eaeaea;
        padding: 5px 75px;
        display: flex;
      }

      .logo {
        height: 55px;
      }

      /* PAGE */
      .page-wrapper {
        padding: 50px 70px;
      }

      /* TITLE */
      #appTitle {
        font-size: 34px;
        font-weight: 600;
        margin-bottom: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* FORM */
      .form-section {
        background: white;
        padding: 40px;
        border-radius: 10px;
        border: 1px solid #eee;
      }

      .form-group label {
        font-weight: 500;
      }

      .form-control {
        height: 48px;
        border-radius: 8px;
        border: 1px solid #e4e6eb;
      }

      textarea.form-control {
        height: 130px;
      }

      .clear-btn {
        margin-top: 20px;
        height: 48px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        font-weight: 500;
        min-width: 100px;
      }

      .clear-btn:hover {
        background: #1d4ed8;
      }

      .submit-btn {
        margin-top: 20px;
        height: 48px;
        border: none;
        border-radius: 8px;
        background: #e72455;
        font-weight: 500;
        min-width: 100px;
      }

      .submit-btn:hover {
        background: #eb0505;
      }

      /* FOOTER */

      .footer{
        margin-top:60px;
        background:#ffffff;
        border-top:1px solid #eaeaea;
        padding:5px;
        display:flex;
        justify-content:center;
        align-items:center;
        gap:10px;
        font-size:14px;
        color:#6b7280;
      }

      .footer-logo{
        height:13px;
      }

      /* MOBILE */
      @media(max-width:768px) {
        .page-wrapper {
          padding: 30px 20px;
        }

        #appTitle {
          font-size: 26px;
        }

        .header {
          background: #d5edff;
          border-bottom: 1px solid #eaeaea;
          padding: 5px 75px;
          display: flex;
          justify-content:center;
          align-items:center;

        }

        .form-section {
          padding: 25px;
        }
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <div class="header d-flex align-items-center">
      <img src="https://ogusuresouces.s3.us-east-1.amazonaws.com/public/ogWebform.png" class="logo">
    </div>
    <!-- PAGE -->
    <div class="page-wrapper">
      <h2 id="appTitle"></h2>
      <div class="form-section" id="formArea"></div>
    </div>
    <!-- FOOTER -->

    <div class="footer">
      <span>© <span id="year"></span> All rights reserved by</span>
      <a href="https://ogusu.co.jp" target="_blank">
        <img src="https://ogusuresouces.s3.us-east-1.amazonaws.com/public/ogusu_logo.jpg" class="footer-logo">
      </a>
    </div>
    <script>
      // const url = window.location.href;
      // const folderName = url.split('/')[3];
      // const parts = folderName.split('-');
      // const directory = parts[0];
      // const appId = parts[1];
      let mainData;
      // const appId = 992;
      // const directory = 'nFjwcyxcHt';
      // const appId = 1118;
      // const directory = 'Ll2CWg7Gwh';

      // const appId = 904;
      // const directory = 'ehthVhECWU';

      const appId = 953;
      const directory = 'DtkDjoWwSm';


      const userSelectConfigure = {
        "relatedApp": {
          "app": "50",
          "code": ""
        },
        "lookupPickerFields": [
          "氏名"
        ],
        "relatedKeyField": "氏名",
        "fieldMappings": [
          {
            "field": "社員番号",
            "relatedField": "社員番号"
          },
          {
            "field": "所属",
            "relatedField": "所属"
          }
        ],
        "sort": "氏名 asc",
        "filterCond": "就労状況 = \"在職\" and 会社区分 in (\"金属籍\", \"熱処理籍\")"
      }

      let allUserData = [];


      async function getAppData(appId) {
        const apiUrl = `https://1frg78a4ae.execute-api.ap-northeast-3.amazonaws.com/dev/app/${appId}`;
        const response = await fetch(apiUrl);
        const data = await response.json();
        return data;
      }


      async function richTextFieldGenerator(fieldData, requiredMark, requiredAttr){
        return `<div class="form-group">
            <label>${fieldData.label} ${requiredMark}</label>
            <textarea class="form-control" id=${fieldData.code} ${requiredAttr}></textarea>
          </div>`;
      }

      

      async function dropDownFieldGenerator(data) {
        console.log(data);

        const res = await fetch(
          "https://1frg78a4ae.execute-api.ap-northeast-3.amazonaws.com/dev/lookup",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
          }
        );

        const result = await res.json();

        return result.records;
      }


      let dataMap = {}; 
      let lookupRelatedfield = [];

      async function singleLineTextGenerator(fieldData, requiredMark = null, requiredAttr = null, subtable = false) {
        const labelTag = subtable ? "": `<label>${fieldData.label} ${requiredMark}</label>`;
        //console.log(fieldData);

        // console.log("Before---------");
        //For default User Retrive Process
        if(fieldData.type == "USER_SELECT"){
          const results = allUserData;

          if (results) {
            // console.log(allUserData);
            // console.log(fieldData.code);
            dataMap[fieldData.code] = results;
            //console.log(dataMap);

            let options = `<option value="">Select ${fieldData.label}</option>`;
            results.forEach(elem => {
               const value = elem['氏名']?.value || "";
               const code = elem['社員番号']?.value || "";
               let mainValue = code;
               if(code == undefined){
                mainValue = value;
               }
               options += `<option value="${code}">${value}</option>`;
            }); 

            return `
              <div class="form-group">
                ${labelTag}
                <select 
                  class="selectpicker form-control" 
                  data-live-search="true" 
                  data-field-code="${fieldData.code}"
                  id="${fieldData.code}"
                  onchange="fieldValueSetFunction(this.value, this)">
                  ${options}
                </select>
              </div>
            `;
          }
        }

        if(fieldData.lookup){
          fieldData.lookup.fieldMappings.forEach(el=>{
            lookupRelatedfield.push(el.field);
          });
          const result = await dropDownFieldGenerator(fieldData.lookup);

          if (result) {
            dataMap[fieldData.code] = result;

            let options = `<option value="">Select ${fieldData.label}</option>`;
            result.forEach(elem => {
              const value = elem[fieldData.lookup.relatedKeyField]?.value || "";
              options += `<option value="${value}">${value}</option>`;
            }); 

            return `
              <div class="form-group">
                ${labelTag}
                <select 
                  class="selectpicker form-control" 
                  data-live-search="true" 
                  data-field-code="${fieldData.code}"
                  id="${fieldData.code}"
                  onchange="fieldValueSetFunction(this.value, this)">
                  ${options}
                </select>
              </div>
            `;
          }
        }

        return `
          <div class="form-group">
            ${labelTag}
            <div class="custom-file">
              <input type="text" class="form-control" id="${fieldData.code}" ${requiredAttr}>
            </div>
          </div>
        `;
      }

      function fieldValueSetFunction(value, selectElem) {
        const fieldCode = selectElem.getAttribute("data-field-code");
        const data = dataMap[fieldCode];
        const matched = data.find(record => {
          const shimei = record[fieldCode]?.value;
          return shimei === value;
        });

        if (matched) {
          const fieldNames = Object.keys(matched);
          fieldNames.map(elem =>{
            if (document.getElementById(elem)) {
              const inputField = document.getElementById(elem);
              if (typeof matched[elem].value === "object") {
                inputField.value = matched[elem].value[0].name || "";
              } else {
                inputField.value = matched[elem].value || "";
              }
              inputField.setAttribute("readonly", true);
            }
          });
        }
      }

      
      async function fileTypeFieldGenerator(fieldData, requiredMark = null, requiredAttr = null, subtable = false){
        const labelTag = subtable ? "": `<label>${fieldData.label} ${requiredMark}</label>`;
        return `<div class="form-group">
            ${labelTag}
            <br/>
            <div class="custom-file" style="width:35%; !important">
              <input type="file" class="custom-file-input" id="${fieldData.code}" ${requiredAttr}>
              <label class="custom-file-label" for="${fieldData.code}">Choose file</label>
            </div>
          </div>`;
      }

      async function dropdownFieldGenerator(fieldData, requiredMark = null, requiredAttr = null, subtable = false){
        const options = Object.values(fieldData.options || {})
          .sort((a,b) => Number(a.index) - Number(b.index));
        
        const labelTag = subtable ? "": `<label>${fieldData.label} ${requiredMark}</label>`;;
          
        return `<div class="form-group">
          ${labelTag}
          <select class="form-control" id=${fieldData.code} ${requiredAttr}>
            <option value="">Please select</option>
            ${options.map(elem => `
              <option value="${elem.label}">${elem.label}</option>
            `).join("")}
          </select>
        </div>`;
      }


      async function radioButtonFieldGenerator(fieldData, requiredMark = null, requiredAttr = null, subtable = false) {

        const options = Object.values(fieldData.options || {})
          .sort((a,b) => Number(a.index) - Number(b.index));

        const labelTag = subtable ? "": `<label>${fieldData.label} ${requiredMark}</label>`;

        return `<div class="form-group">
          ${labelTag}
          <div>

            ${options.map(elem => `
              <div class="form-check ${fieldData.align === "HORIZONTAL" ? "form-check-inline" : ""}">
                <input 
                  class="form-check-input" 
                  type="radio" 
                  name="${fieldData.code}" 
                  id="${fieldData.code}_${elem.index}"
                  value="${elem.label}"
                  ${fieldData.defaultValue === elem.label ? "checked" : ""}
                  ${requiredAttr}
                >
                <label class="form-check-label" for="${fieldData.code}_${elem.index}">
                  ${elem.label}
                </label>
              </div>
            `).join("")}

          </div>
        </div>`;
      }

      async function checkboxFieldGenerator(fieldData, requiredMark = null, requiredAttr = null, subtable = false){

        const options = Object.values(fieldData.options || {})
          .sort((a,b) => Number(a.index) - Number(b.index));

        const defaultValues = fieldData.defaultValue || [];
        const labelTag = subtable ? "": `<label>${fieldData.label} ${requiredMark}</label>`;

        return `<div class="form-group">
          ${labelTag}
          <div>

            ${options.map(elem => `
              <div class="form-check ${fieldData.align === "HORIZONTAL" ? "form-check-inline" : ""}">
                <input 
                  class="form-check-input"
                  type="checkbox"
                  name="${fieldData.code}[]"
                  id="${fieldData.code}_${elem.index}"
                  value="${elem.label}"
                  ${defaultValues.includes(elem.label) ? "checked" : ""}
                  ${requiredAttr}
                >
                <label class="form-check-label" for="${fieldData.code}_${elem.index}">
                  ${elem.label}
                </label>
              </div>
            `).join("")}

          </div>
        </div>`;
      }


      async function dateTimeFieldGenerator(fieldData, requiredMark = null, requiredAttr = null, subtable = false) {

        const defaultValue = fieldData.defaultValue || "";
        const labelTag = subtable ? "": `<label>${fieldData.label} ${requiredMark}</label>`;

        let fieldType = fieldData.type == "TIME" ? "time" : "date";

        return `
          <div class="form-group">
            ${labelTag}
            <input
              type=${fieldType}
              class="form-control"
              name="${fieldData.code}"
              id="${fieldData.code}"
              value="${defaultValue}"
              ${requiredAttr}
            >
          </div>
        `;
      }


      // Table Generator function start

      let tableFields = [];

     async function tableGenerator(fieldData){

        tableFields = Object.values(fieldData.fields);

        let header = tableFields.map(f => `<th>${f.label}</th>`).join("");
        header += `<th style="min-width: 100px !important;">Action</th>`;

        return `
        <table class="table table-bordered" id=${fieldData.code}>
          <thead>
            <tr>${header}</tr>
          </thead>

          <tbody id="tableBody">
            ${await tableRowGenerator()}
          </tbody>
        </table>`;
      }


      async function tableRowGenerator(){
        const requiredMark = '';

        const requiredAttr = "";

        let row = "<tr>";

        for(const field of tableFields){
          //console.log(field);
          console.log(field);

          let fieldHTML = "";

          fieldHTML = await formFieldGenerator(field, subtable=true);
          row += `<td>${fieldHTML}</td>`;
        }

        row += `
        <td>
          <button type="button" class="btn btn-sm btn-success addRow">+</button>
          <button type="button" class="btn btn-sm btn-danger removeRow">-</button>
        </td>`;

        row += "</tr>";

        return row;
      }

      //End

      async function formFieldGenerator(fieldData, subtable = false){
        // console.log(fieldData.code +" => "+fieldData.type);
        // console.log(fieldData);
        // console.log("--------------------------------------");
        
        const requiredMark = fieldData.required 
          ? '<span style="color:red">*</span>' 
          : '';

        const requiredAttr = fieldData.required ? "required" : "";

        if(fieldData.type === "RICH_TEXT" || fieldData.type === "MULTI_LINE_TEXT" ){
          return await richTextFieldGenerator(fieldData, requiredMark, requiredAttr, subtable);
        }

        if(fieldData.type === "SUBTABLE"){
          const tableData =  await tableGenerator(fieldData);
          return `<div class="form-group">
            <label>${fieldData.label} ${requiredMark}</label>
            ${tableData}
          </div>`;
        }

        if(["SINGLE_LINE_TEXT", "NUMBER", "RECORD_NUMBER", "GROUP", "MODIFIER", "STATUS", "CATEGORY", "CREATOR", "ORGANIZATION_SELECT", "GROUP_SELECT", "USER_SELECT"].includes(fieldData.type)){
          return await singleLineTextGenerator(fieldData, requiredMark, requiredAttr, subtable);
        }

        if(fieldData.type == "FILE"){
          return await fileTypeFieldGenerator(fieldData, requiredMark, requiredAttr, subtable);
        }

        if(["DROP_DOWN"].includes(fieldData.type)){
          return await dropdownFieldGenerator(fieldData, requiredMark, requiredAttr, subtable);
        }

        if(fieldData.type == "RADIO_BUTTON"){
          return await radioButtonFieldGenerator(fieldData, requiredMark, requiredAttr, subtable);
        }

        if(fieldData.type == "CHECK_BOX"){
          return await checkboxFieldGenerator(fieldData, requiredMark, requiredAttr, subtable);
        }

        if(["UPDATED_TIME", "DATETIME", "CREATED_TIME", "DATE", "TIME"].includes(fieldData.type)){
          return await dateTimeFieldGenerator(fieldData, requiredMark, requiredAttr, subtable);
        }

        return `<div class="form-group">
          <label>${fieldData.label} ${requiredMark}</label>
        </div>`;
      }
      
      async function formGenerator(data){
        let formContruct = "";

        for(const elem of data){
          formContruct += await formFieldGenerator(elem);
        }

        return `<form>
          ${formContruct}
          <div class="text-right">
            <button class="btn clear-btn text-white mr-1">Clear</button>
            <button class="btn submit-btn text-white">Submit</button>
          </div>
          
        </form>`;
      }

      function fieldTypeDetector(alldata, fieldCode) {

          const field = alldata.fields[fieldCode];
          if (!field) {
              console.log("Field not found:", fieldCode);
              return null;
          }
  
          return field.type;
      }

      function generateTableValue(tableArray, fieldTypeHolder) {
        console.log(fieldTypeHolder);
        let valueArray = [];

        tableArray.forEach(row => {
            let rowValue = {
                id: "",  // নতুন row হলে empty, edit হলে existing id দাও
                value: {}
            };

            row.ids.forEach(field => {
                //console.log(field);
                const fieldType = fieldTypeDetector(fieldTypeHolder, field.id);
                //console.log(fieldType);


                // type অনুযায়ী value structure বানাও
                if (fieldType == "USER_SELECT" || fieldType == "GROUP_SELECT") {
                    // array type value
                    rowValue.value[field.id] = {
                        type: fieldType,
                        value: [{ code: field.value}]
                    };

                } else if (fieldType === "DROP_DOWN" || fieldType === "NUMBER" || fieldType === "SINGLE_LINE_TEXT") {
                    // simple value
                    console.log(field);
                    rowValue.value[field.id] = {
                        type: fieldType,
                        value: field.value
                    };

                } else {
                    // default — অন্য সব type
                    rowValue.value[field.id] = {
                        type: fieldType,
                        value: field.value
                    };
                }
            });

            valueArray.push(rowValue);
        });

        return valueArray;
    }


      async function blobToBase64(blob) {
          return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result.split(',')[1]);
              reader.onerror = reject;
              reader.readAsDataURL(blob);
          });
      }

      const skipFieldTypeforSubmission = ['MODIFIER', 'STATUS', 'CATEGORY', 'STATUS_ASSIGNEE', 'UPDATED_TIME', 'CREATED_TIME', 'CREATOR', 'GROUP'];

      async function manageSubmissionOfFormData() {
        let formData = {};

        mainData.mainFieldProperties.forEach(async elem => {
          if (!lookupRelatedfield.includes(elem.code) && !skipFieldTypeforSubmission.includes(elem.type)) {
            //console.log(elem.code);
            if (elem.type == "RADIO_BUTTON") {
              formData[elem.code] = {
                value: document.querySelector(`input[name="${elem.code}"]:checked`)?.value || ""
              };
            } else if (elem.type == "DROP_DOWN") {
              formData[elem.code] = {
                value: document.getElementById(elem.code).value || ""
              };
            } else if (elem.type == "FILE") {
              const fileInput = document.getElementById(elem.code);
              const file = fileInput.files[0]; 
              if (file) {
                  const base64 = await blobToBase64(file); 
                  console.log(base64); 
              }
              // const blob = new Blob([document.getElementById(elem.code).value], { type: 'text/plain' });
              // const base64 = blobToBase64(blob);
              // console.log(base64);

              // formData[elem.code] = {
              //   value: document.getElementById(elem.code).value || ""
              // };
            } else if (elem.type == "SUBTABLE") {
              let tableRow = document.getElementById(elem.code);
              const rows = tableRow.querySelectorAll("tr");
    
              let tableArray = [];

              rows.forEach((row, rowIndex) => {
                  let rowData = {
                      rowIndex: rowIndex,
                      ids: []
                  };
                  
                  row.querySelectorAll("td").forEach((td, tdIndex) => {
                      const field = td.querySelector("[id]");
                      if (field) {
                          rowData.ids.push({
                              tdIndex: tdIndex,
                              id: field.id,
                              value: field.value
                          });
                      }
                  });

                  if (rowData.ids.length > 0) {
                      tableArray.push(rowData);
                  }
              });
              

              let fieldData = generateTableValue(tableArray, elem);

              //Test Parsepective
              formData[elem.code] = {
                value: fieldData
              };


            } else {
              formData[elem.code] = {
                value: document.getElementById(elem.code).value
              };  
            }
          }
          
        });

        console.log(formData);
        

        // const response = await fetch("https://1frg78a4ae.execute-api.ap-northeast-3.amazonaws.com/dev/saveRecordIntoKintone", {
        //   method: "POST",
        //   headers: {
        //     "Content-Type": "application/json"
        //   },
        //   body: JSON.stringify({ 
        //     kintoneAppId: mainData.kintoneAppId,
        //     record: formData
        //   })
        // });

        // const result = await response.json();
        // console.log(result);
      }
      

      async function loadMainData() {
          const data = await getAppData(appId);
          mainData = data.find(item => item.directory === directory);
        }
        (async () => {
          await loadMainData();
          allUserData = await dropDownFieldGenerator(userSelectConfigure);
          console.log(mainData);
          document.getElementById("year").innerText = new Date().getFullYear();
          document.getElementById("appTitle").innerText = mainData.title;
          document.getElementById("formArea").innerHTML = await formGenerator(mainData.mainFieldProperties);

          
          $('.selectpicker').selectpicker({
            width: '100%',
            size: 7
          });
          


          document.querySelector(".submit-btn").addEventListener("click", async function(e) {
             e.preventDefault();
             const data = await manageSubmissionOfFormData();
            // console.log(data); // array দেখতে পাবে
          });


          document.addEventListener("change", function(e){
            if(e.target.classList.contains("custom-file-input")){
              const fileName = e.target.files[0]?.name || "Choose file";
              e.target.nextElementSibling.innerText = fileName;
            }
          });

          //Dynamic Table Script 
          document.addEventListener("click", async function(e){
            // if(e.target.classList.contains("addRow")){
            //   const tableBody = document.getElementById("tableBody");
            //   console.log(tableBody);
            //   const newRow = await tableRowGenerator();
            //   console.log(newRow);
            //   tableBody.insertAdjacentHTML("beforeend", newRow);
            // }

            if (e.target.classList.contains("addRow")) {
                const tableBody = document.getElementById("tableBody");
                const newRow = await tableRowGenerator();

                const tempTbody = document.createElement("tbody");
                tempTbody.innerHTML = newRow.trim();

                const trElement = tempTbody.querySelector("tr");
                if (trElement) {
                    tableBody.appendChild(trElement);
                    $(trElement).find('.selectpicker').selectpicker({
                        size: 5  
                    });
                }
            }


            if(e.target.classList.contains("removeRow")){
              const row = e.target.closest("tr");
              const rows = document.querySelectorAll("#tableBody tr");

              if(rows.length > 1){
                row.remove();
              }
            }
          });
          

        })();
    </script>
  </body>
</html>
